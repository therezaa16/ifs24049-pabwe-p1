  <!-- ===== Form pendaftaran akun ===== -->
  <main>
    <h1>Pendaftaran Akun Baru</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Daftar Akun</legend>

        <!-- Nama lengkap -->
        <p>
          <label for="nama">Nama Lengkap:</label>
          <input type="text" id="nama" name="nama" minlength="3" maxlength="100" required>
        </p>

        <!-- Jenis kelamin -->
        <p>
          Jenis Kelamin:
          <input type="radio" id="lk" name="jenis_kelamin" value="Laki-Laki" required>
          <label for="lk">Laki-Laki</label>
          <input type="radio" id="pr" name="jenis_kelamin" value="Perempuan" required>
          <label for="pr">Perempuan</label>
        </p>

        <!-- Tempat lahir -->
        <p>
          <label for="tempat_lahir">Tempat Lahir:</label>
          <input type="text" id="tempat_lahir" name="tempat_lahir" required>
        </p>

        <!-- Tanggal lahir -->
        <p>
          <label for="tanggal_lahir">Tanggal Lahir:</label>
          <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
        </p>

        <!-- Agama -->
        <p>
          <label for="agama">Agama:</label>
          <select id="agama" name="agama" required>
            <option value="" selected disabled>--- Pilih Agama ---</option>
            <option value="Islam">Islam</option>
            <option value="Katolik">Katolik</option>
            <option value="Protestan">Protestan</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
            <option value="Konghucu">Konghucu</option>
          </select>
        </p>

        <!-- Hobi -->
        <p>
          Hobi:
          <input type="checkbox" id="hobi_olahraga" name="hobi" value="Olahraga">
          <label for="hobi_olahraga">Olahraga</label>
          <input type="checkbox" id="hobi_membaca" name="hobi" value="Membaca">
          <label for="hobi_membaca">Membaca</label>
          <input type="checkbox" id="hobi_ngoding" name="hobi" value="Ngoding">
          <label for="hobi_ngoding">Ngoding</label>
        </p>

        <!-- Password -->
        <p>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </p>

        <!-- Persetujuan -->
        <p>
          <input type="checkbox" id="persetujuan" name="persetujuan" value="setuju" required>
          <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
        </p>

        <!-- Tombol aksi -->
        <p>
          <input type="reset" value="Reset">
          <input type="submit" value="Submit">
        </p>

      </fieldset>
    </form>
  </main>

</body>
</html>
